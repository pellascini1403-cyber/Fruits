<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fruvo | Fruits Merge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      Every visual on this page is one of the provided PNGs, shown unmodified.
      Code only positions them and makes them interactive.

      #background-layer  the bedroom background
      #game-box          the machine (glass box + console + reserved ad bar)
      #sim-space         physics coordinate space, transformed by layout.ts
                         onto the machine's glass interior; fruits + launcher
      .hud               built by hud.ts from the HUD PNGs
      .modal-overlay     built by panels.ts from the panel PNGs
    -->
    <div id="game-root">
      <div id="background-layer" aria-hidden="true"></div>
      <div id="ui-root">
        <img id="game-box" src="../assets/box/game-box-purple.png" alt="" draggable="false" />
        <div id="sim-space"></div>
      </div>
    </div>

    <script src="dist/bundle.js"></script>
  </body>
</html>

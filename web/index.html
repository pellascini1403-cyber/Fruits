<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fruvo | Fruits Merge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      #game-root is the fixed, full-viewport stage. Everything the game ever
      shows lives inside it, stacked on top of #background-layer.

      #background-layer holds ONLY the provided background image, unmodified,
      scaled with `cover` so it fills any resolution/aspect ratio without
      stretching or distorting it. Nothing else is drawn on it.

      #ui-root holds every piece of interface, always rendered above the
      background. Right now it only has #game-box (the game container: glass
      box + metal console + reserved black ad zone, all baked into one
      image, unmodified, anchored to the bottom edge). Future HUD/buttons/
      fruit/menus mount inside #ui-root too, on top of #game-box.
    -->
    <div id="game-root">
      <div id="background-layer" aria-hidden="true"></div>
      <div id="ui-root">
        <img id="game-box" src="../assets/box/game-box.png" alt="" />
      </div>
    </div>
  </body>
</html>
